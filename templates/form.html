<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average Marks Calculator</title>
</head>

<body>

    <div class="calculate">

        <h1>Calculate Average Marks</h1>

        <!-- Main Input For Receiving Query -->
        <form action="{{ url_for('form') }}" method="post">

            <input type="text" name="maths" placeholder="Maths" required />

            <input type="text" name="science" placeholder="Science" required />

            <input type="text" name="history" placeholder="History" required />

            <br><br>

            <button type="submit" class="btn btn-primary btn-block btn-large">
                Calculate
            </button>

        </form>

        <br>

        {% if avg_marks == 0 %}

            <div style="display: none;">
                Total Average: {{ avg_marks }}
            </div>

        {% else %}

            <div style="display: block;">
                <h3>Total Average: {{ avg_marks }}</h3>
            </div>

        {% endif %}

    </div>

</body>
</html>
